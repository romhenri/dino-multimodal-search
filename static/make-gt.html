<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Search ground truth</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6860;
    --line: #e3e0d8; --accent: #b45309; --bad: #b0213a; --chip: #fbefe3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --card: #1e201d; --ink: #ecebe6; --muted: #9a978f;
            --line: #30332e; --accent: #f59e57; --bad: #f0707f; --chip: #33261b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .head h2 { margin: 0; font-size: 1.15rem; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  /* Reference and board are both white 4:3 tiles, in dark mode too, so drawings export on white. */
  .stage img, #board { display: block; width: 100%; aspect-ratio: 4 / 3; background: #fff;
                       border: 1px solid var(--line); border-radius: 8px; }
  .stage img { object-fit: contain; }
  #board { touch-action: none; cursor: crosshair; }
  .tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .tools button { width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
                  color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .tools button:hover { color: var(--ink); border-color: var(--muted); }
  .tools button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .tools #clear { margin-left: auto; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .actions button { padding: 10px 18px; color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .actions button:hover { color: var(--ink); border-color: var(--muted); }
  .actions .primary { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .actions .primary:hover { color: var(--bg); border-color: var(--accent); }
  .actions button:disabled { opacity: .45; cursor: not-allowed; }
  .err { color: var(--bad); }
  @media (max-width: 640px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Ground truth de desenhos</h1>
  <p class="sub">Desenhe o dinossauro da foto e passe para o próximo. No fim, baixe o JSON para usar na avaliação. <a href="/">Voltar à busca</a></p>

  <section id="draw" hidden>
    <div class="head"><h2 id="name"></h2><span class="progress" id="progress"></span></div>
    <div class="stage">
      <img id="ref" alt="">
      <div>
        <div class="tools" role="toolbar" aria-label="Ferramentas de desenho">
          <button type="button" data-tool="pen" aria-pressed="true" aria-label="Caneta" title="Caneta">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></svg>
          </button>
          <button type="button" data-tool="pencil" aria-pressed="false" aria-label="Lápis" title="Lápis">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
          </button>
          <button type="button" data-tool="eraser" aria-pressed="false" aria-label="Borracha" title="Borracha">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          </button>
          <button type="button" id="clear" aria-label="Limpar quadro" title="Limpar quadro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        </div>
        <canvas id="board" width="640" height="480" aria-label="Quadro para desenhar o dinossauro"></canvas>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="finish">Finalizar e baixar</button>
      <button type="button" id="skip">Pular</button>
      <button type="button" id="next" class="primary" disabled>Próximo</button>
    </div>
  </section>

  <section id="done" hidden>
    <p id="summary"></p>
    <div class="actions" style="justify-content: flex-start">
      <button type="button" id="download" class="primary">Baixar JSON</button>
      <button type="button" id="restart">Nova sessão</button>
    </div>
  </section>

  <p id="out" aria-live="polite"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Same tools as the home board. ponytail: duplicated from index.html, extract a shared board.js if a third page needs it.
// The bitmap is a fixed 640x480 regardless of screen, so every ground-truth PNG has the same size.
const board = $("board");
const ctx = board.getContext("2d");
const TOOLS = {
  pen: { color: "#1d1c1a", width: 4, alpha: 1 },
  pencil: { color: "#55524c", width: 1.5, alpha: 0.8 },
  eraser: { color: "#fff", width: 24, alpha: 1 },
};
let tool = "pen";
let last;
let drawn = false;
const clearBoard = () => {
  ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, board.width, board.height);
  drawn = false; $("next").disabled = true;
};
const point = (e) => [e.offsetX * board.width / board.clientWidth, e.offsetY * board.height / board.clientHeight];

function stroke(e) {
  const t = TOOLS[tool], p = point(e);
  ctx.globalAlpha = t.alpha;
  ctx.strokeStyle = t.color;
  ctx.lineWidth = t.width * board.width / board.clientWidth;
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(...last);
  ctx.lineTo(...p);
  ctx.stroke();
  last = p;
  if (tool !== "eraser") { drawn = true; $("next").disabled = false; }
}
board.onpointerdown = (e) => { board.setPointerCapture(e.pointerId); last = point(e); stroke(e); };
board.onpointermove = (e) => { if (last) stroke(e); };
board.onpointerup = board.onpointercancel = () => { last = undefined; };
$("clear").onclick = clearBoard;
const toolButtons = document.querySelectorAll("[data-tool]");
for (const b of toolButtons) {
  b.onclick = () => {
    tool = b.dataset.tool;
    for (const o of toolButtons) o.setAttribute("aria-pressed", o === b);
  };
}

// Session: every dino once, in random order.
let queue = [], index = 0, items = [], startedAt, shownAt, saved = true;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show() {
  if (index >= queue.length) return finish();
  const nome = queue[index];
  $("name").textContent = nome;
  $("progress").textContent = `${index + 1} / ${queue.length} · ${items.length} desenhados`;
  $("ref").src = `/img/${encodeURIComponent(nome)}.png`;
  $("ref").alt = `Foto de referência: ${nome}`;
  clearBoard();
  shownAt = Date.now();
}

function advance(save) {
  if (save) {
    items.push({
      nome: queue[index],
      desenho: board.toDataURL("image/png"),
      desenhado_em: new Date().toISOString(),
      duracao_ms: Date.now() - shownAt,
    });
    saved = false;
  }
  index++;
  show();
}

function finish() {
  $("draw").hidden = true;
  $("done").hidden = false;
  $("summary").textContent = `${items.length} desenho(s) de ${queue.length} dinossauros.`;
  $("download").disabled = !items.length;
}

function download() {
  const finishedAt = new Date();
  const gt = {
    versao: 1,
    criado_em: startedAt.toISOString(),
    finalizado_em: finishedAt.toISOString(),
    tamanho_px: [board.width, board.height],
    total: items.length,
    itens: items,
  };
  const stamp = finishedAt.toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(gt, null, 2)], { type: "application/json" }));
  a.download = `gt-desenhos-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  saved = true;
}

async function start() {
  try {
    const r = await fetch("/dinos");
    if (!r.ok) throw new Error(`erro ${r.status}`);
    queue = shuffle((await r.json()).map((d) => d.nome));
  } catch (e) {
    $("out").className = "err";
    $("out").textContent = `Falha ao carregar os dinossauros: ${e.message}`;
    return;
  }
  index = 0; items = []; saved = true; startedAt = new Date();
  $("done").hidden = true;
  $("draw").hidden = false;
  show();
}

$("next").onclick = () => advance(true);
$("skip").onclick = () => advance(false);
$("finish").onclick = () => { if (drawn) advance(true); finish(); };
$("download").onclick = download;
$("restart").onclick = () => { if (saved || confirm("Descartar os desenhos não baixados?")) start(); };
// Drawings live only in memory until downloaded.
window.onbeforeunload = (e) => { if (!saved) e.preventDefault(); };

start();
</script>
</body>
</html>
