<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Search multimodal</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6860;
    --line: #e3e0d8; --accent: #b45309; --bar: #f7dcc2; --bad: #b0213a; --chip: #fbefe3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --card: #1e201d; --ink: #ecebe6; --muted: #9a978f;
            --line: #30332e; --accent: #f59e57; --bar: #4a321f; --bad: #f0707f; --chip: #33261b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .tag { font-size: .75rem; font-weight: 600; vertical-align: middle; padding: 2px 8px; margin-left: 6px;
         border-radius: 999px; color: var(--accent); background: var(--chip); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: var(--accent); }
  form { display: flex; gap: 8px; margin-bottom: 28px; }
  .field { flex: 1; position: relative; display: flex; }
  textarea { flex: 1; resize: vertical; min-height: 52px; padding: 12px 48px 12px 12px; font: inherit;
             color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  form button { padding: 0 20px; border: 0; background: var(--accent); color: var(--bg); font-weight: 600; }
  #go { min-width: 136px; }  /* room for "Buscando…" so the field doesn't jump */
  #go:disabled { opacity: .75; cursor: progress; }
  #go[aria-busy="true"]::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px;
                                  vertical-align: -2px; border: 2px solid currentColor; border-right-color: transparent;
                                  border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  form #mic { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0;
              display: grid; place-items: center; color: var(--muted); background: transparent; border-radius: 50%; }
  form #mic[hidden] { display: none; }
  form #mic:hover { color: var(--accent); }
  form #mic[aria-pressed="true"] { color: var(--bg); background: var(--bad); }
  .tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .tools button { width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
                  color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .tools button:hover { color: var(--ink); border-color: var(--muted); }
  .tools button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .tools #save-sketch { margin-left: auto; }
  .tools #save-sketch.ok { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  /* White like the paleoart tiles, in dark mode too, so drawings export on white. */
  #board { display: block; width: 100%; aspect-ratio: 2 / 1; margin-bottom: 12px; background: #fff;
           border: 1px solid var(--line); border-radius: 8px; touch-action: none; cursor: crosshair; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 12px;
          display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; align-items: start; }
  .card figure { margin: 0; }
  /* Paleoart ships on white backgrounds; keep a white tile in dark mode too. */
  .card figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain;
                     background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .card figcaption { font-size: .68rem; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .card figcaption a { color: inherit; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .head h2 { margin: 0; font-size: 1.15rem; }
  .score { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin: 8px 0 12px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .chip.bad { color: var(--bad); background: transparent; border: 1px solid currentColor; }
  .chip.miss { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
  .desc { margin: 0; color: var(--muted); font-size: .92rem; }
  .meta { font-size: .78rem; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); }
  .read { color: var(--muted); margin: 0 0 16px; }
  .read strong { color: var(--ink); }
  /* Skeleton cards while a search runs, laid out like the real ones. */
  .sk { background: var(--line); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
  .sk-title { height: 20px; width: 45%; }
  .sk-bar { height: 6px; margin: 14px 0 16px; }
  .sk-line { height: 12px; margin-bottom: 10px; }
  .sk-line.short { width: 60%; }
  .sk-img { aspect-ratio: 4 / 3; border-radius: 8px; }
  @keyframes pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sk, #go[aria-busy="true"]::before { animation: none; } }
  @media (max-width: 520px) {
    form { flex-direction: column; } form button { padding: 12px; }
    .card { grid-template-columns: minmax(0, 1fr) 104px; gap: 12px; }
  }
</style>
</head>
<body>
<main>
  <h1>Dino Search <span class="tag">multimodal</span></h1>
  <p class="sub">Descreva a aparência de um dinossauro <strong>digitando ou falando</strong> e veja os mais parecidos, com <strong>texto e ilustração</strong>. <a href="/all">Ver todos</a></p>

  <div class="tools" role="toolbar" aria-label="Ferramentas de desenho">
    <button type="button" data-tool="pen" aria-pressed="true" aria-label="Caneta" title="Caneta">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button type="button" data-tool="pencil" aria-pressed="false" aria-label="Lápis" title="Lápis">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
    </button>
    <button type="button" data-tool="eraser" aria-pressed="false" aria-label="Borracha" title="Borracha">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </button>
    <button type="button" id="save-sketch" aria-label="Salvar desenho para anotação" title="Salvar desenho para anotação">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <button type="button" id="clear" aria-label="Limpar quadro" title="Limpar quadro">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>
  </div>
  <canvas id="board" aria-label="Quadro para desenhar o dinossauro"></canvas>

  <form id="f">
    <div class="field">
      <textarea id="q" aria-label="Descrição física do dinossauro" placeholder="Digite ou fale, ex.: quadrúpede enorme com placas nas costas e espinhos na cauda"></textarea>
      <button id="mic" type="button" aria-pressed="false" aria-label="Descrever por voz" title="Descrever por voz" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
    </div>
    <button id="go" type="submit">Buscar</button>
  </form>

  <div id="out" aria-live="polite"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const label = (t) => t.replaceAll("_", " ");
let credits = {};
fetch("/img/credits.json").then((r) => r.json()).then((c) => { credits = c; }).catch(() => {});

function card(h) {
  const chips = [
    ...h.tracos_correspondentes.map((t) => `<span class="chip">${esc(label(t))}</span>`),
    ...h.tracos_conflitantes.map((t) => `<span class="chip bad" title="conflita com a descrição">${esc(label(t))}</span>`),
    ...h.tracos_nao_correspondentes.map((t) => `<span class="chip miss" title="não tem">${esc(label(t))}</span>`),
  ].join("");
  const similarity = h.similaridade;
  const c = credits[h.nome];
  const credit = c ? `<figcaption>${esc(c.autor)} · <a href="${esc(c.fonte)}" target="_blank" rel="noopener">${esc(c.licenca)}</a></figcaption>` : "";
  return `<article class="card">
    <div>
      <div class="head"><h2>${esc(h.nome)}</h2><span class="score">Similaridade ${similarity.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 4 })}</span></div>
      <div class="bar" aria-hidden="true"><div style="width:${similarity * 100}%"></div></div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <p class="desc">${esc(h.descricao_fisica)}</p>
      <div class="meta">final ${h.score_final.toFixed(3)} · embedding ${h.score_embedding.toFixed(3)} · atributos ${h.score_atributos.toFixed(2)}${h.penalidade ? ` · penalidade ${h.penalidade}` : ""}${fusion(h)}</div>
    </div>
    <figure>
      <img src="/img/${encodeURIComponent(h.nome)}.png" alt="Ilustração de ${esc(h.nome)}" loading="lazy" onerror="this.parentElement.remove()">
      ${credit}
    </figure>
  </article>`;
}

// Rank of the dino in each fused ranking; only worth showing once the drawing is in the mix.
const fusion = (h) => (Object.keys(h.posicoes).length > 1
  ? `<br>RRF ${h.score_rrf.toFixed(4)} · ${Object.entries(h.posicoes).map(([k, r]) => `${k} #${r}`).join(" · ")}` : "");

let activeSearch;
let autoText = "";  // description CLIP put in the field; goes away with the drawing while untouched
const SKELETON = `<article class="card" aria-hidden="true"><div><div class="sk sk-title"></div><div class="sk sk-bar"></div>
  <div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
  <div class="sk sk-img"></div></article>`.repeat(3);
// Disabled with a spinner while searching, so a click visibly did something.
function busy(on) {
  const go = $("go");
  go.disabled = on;
  go.setAttribute("aria-busy", on);
  go.textContent = on ? "Buscando…" : "Buscar";
}

async function search() {
  const query = $("q").value.trim();
  activeSearch?.abort();
  const out = $("out");
  if (!query && !drawn) {
    activeSearch = undefined;
    out.replaceChildren();
    out.removeAttribute("aria-busy");
    busy(false);
    return;
  }
  const controller = new AbortController();
  activeSearch = controller;
  out.setAttribute("aria-busy", "true");
  out.innerHTML = SKELETON;
  busy(true);
  try {
    const r = await fetch("/search/multimodal", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, desenho: drawn ? board.toDataURL("image/png") : null, top_k: 5 }),
      signal: controller.signal,
    });
    if (!r.ok) throw new Error(`erro ${r.status}`);
    const { grupo, descricao_desenho: read, resultados } = await r.json();
    const sketch = read ? `<p class="read">Desenho lido como grupo <strong>${esc(grupo)}</strong>: ${esc(read)}</p>` : "";
    if (activeSearch !== controller) return;
    out.innerHTML = sketch + resultados.map(card).join("");
    // Drawing only: what CLIP read becomes the text, to edit or refine (unless typed meanwhile).
    if (!query && read && !$("q").value.trim()) $("q").value = autoText = read;
  } catch (e) {
    if (activeSearch === controller) out.innerHTML = `<p class="err">Falha na busca: ${esc(e.message)}</p>`;
  } finally {
    if (activeSearch === controller) {
      activeSearch = undefined;
      out.removeAttribute("aria-busy");
      busy(false);
    }
  }
}

$("f").onsubmit = (e) => { e.preventDefault(); search(); };
$("q").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); search(); } };

// Whiteboard. Once something is drawn, every search sends it along with the text.
const board = $("board");
const ctx = board.getContext("2d");
const TOOLS = {
  pen: { color: "#1d1c1a", width: 4, alpha: 1 },
  pencil: { color: "#55524c", width: 1.5, alpha: 0.8 },
  eraser: { color: "#fff", width: 24, alpha: 1 },
};
let tool = "pen";
let last;
let drawn = false;
const dpr = window.devicePixelRatio || 1;
board.width = board.clientWidth * dpr;
board.height = board.clientHeight * dpr;
const clearBoard = () => {
  ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, board.width, board.height); drawn = false;
  if (autoText && $("q").value === autoText) $("q").value = "";
  autoText = "";
};
clearBoard();
// The bitmap is sized once; CSS rescales it on resize, so map pointer coords through the current scale.
const point = (e) => [e.offsetX * board.width / board.clientWidth, e.offsetY * board.height / board.clientHeight];

function stroke(e) {
  const t = TOOLS[tool], p = point(e);
  ctx.globalAlpha = t.alpha;
  ctx.strokeStyle = t.color;
  ctx.lineWidth = t.width * board.width / board.clientWidth;
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(...last);
  ctx.lineTo(...p);
  ctx.stroke();
  last = p;
  if (tool !== "eraser") drawn = true;
}
board.onpointerdown = (e) => { board.setPointerCapture(e.pointerId); last = point(e); stroke(e); };
board.onpointermove = (e) => { if (last) stroke(e); };
board.onpointerup = board.onpointercancel = () => { last = undefined; };
$("clear").onclick = clearBoard;
// Sends the drawing to the server's annotation pile (data/desenhos.jsonl); the icon turns into a check.
const saveIcon = $("save-sketch").innerHTML;
$("save-sketch").onclick = async () => {
  const b = $("save-sketch");
  if (!drawn || b.disabled) return;
  b.disabled = true;
  try {
    const r = await fetch("/sketches", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ desenho: board.toDataURL("image/png"), texto: $("q").value }),
    });
    if (!r.ok) {
      const { detail } = await r.json().catch(() => ({}));
      throw new Error(typeof detail === "string" ? detail : `erro ${r.status}`);
    }
    b.classList.add("ok");
    b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
    b.title = "Desenho salvo";
    setTimeout(() => { b.classList.remove("ok"); b.innerHTML = saveIcon; b.title = b.getAttribute("aria-label"); }, 1500);
  } catch (e) {
    $("out").innerHTML = `<p class="err">Falha ao salvar o desenho: ${esc(e.message)}</p>`;
  } finally {
    b.disabled = false;
  }
};
const toolButtons = document.querySelectorAll("[data-tool]");
for (const b of toolButtons) {
  b.onclick = () => {
    tool = b.dataset.tool;
    for (const o of toolButtons) o.setAttribute("aria-pressed", o === b);
  };
}

// Speech-to-text via the browser's Web Speech API (Chrome, Edge, Safari). Hidden where unsupported.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Recognition) {
  const rec = new Recognition();
  rec.lang = "pt-BR";
  rec.interimResults = true;
  const mic = $("mic");
  mic.hidden = false;
  mic.onclick = () => (mic.getAttribute("aria-pressed") === "true" ? rec.stop() : rec.start());
  let heard = false;
  rec.onstart = () => { heard = false; mic.setAttribute("aria-pressed", "true"); };
  rec.onresult = (e) => { heard = true; $("q").value = [...e.results].map((r) => r[0].transcript).join(""); };
  rec.onend = () => { mic.setAttribute("aria-pressed", "false"); if (heard) search(); };
  rec.onerror = (e) => {
    if (e.error !== "no-speech" && e.error !== "aborted") $("out").innerHTML = `<p class="err">Falha no microfone: ${esc(e.error)}</p>`;
  };
}
</script>
</body>
</html>
